<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2E46"/>
      <stop offset="0.55" stop-color="#0A1F33"/>
      <stop offset="1" stop-color="#071423"/>
    </linearGradient>
    <radialGradient id="dr-glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#0DB7ED" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#0DB7ED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dr-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4FBFF"/>
      <stop offset="1" stop-color="#C4E6F7"/>
    </linearGradient>
    <clipPath id="dr-boxclip">
      <rect x="112" y="236" width="288" height="152" rx="12"/>
    </clipPath>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#dr-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#dr-glow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="404" rx="150" ry="15" fill="#000000" opacity="0.35"/>

  <!-- remote signal arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M 134 186 A 122 122 0 0 1 378 186" stroke="#B9E9FB" stroke-width="17"/>
    <path d="M 172 186 A 84 84 0 0 1 340 186" stroke="#5ED3F5" stroke-width="17"/>
    <path d="M 210 186 A 46 46 0 0 1 302 186" stroke="#0DB7ED" stroke-width="17"/>
  </g>

  <!-- antenna mast + beacon -->
  <rect x="251" y="196" width="10" height="46" rx="5" fill="#0E7AAE"/>
  <circle cx="256" cy="186" r="16" fill="#0DB7ED" stroke="#FFFFFF" stroke-width="6"/>

  <!-- shipping container -->
  <rect x="112" y="236" width="288" height="152" rx="12" fill="url(#dr-box)"/>
  <g clip-path="url(#dr-boxclip)">
    <rect x="112" y="236" width="288" height="22" fill="#0E7AAE"/>
    <rect x="112" y="366" width="288" height="22" fill="#0E7AAE" opacity="0.55"/>
    <g stroke="#0E7AAE" stroke-width="6">
      <line x1="140" y1="264" x2="140" y2="360"/>
      <line x1="166" y1="264" x2="166" y2="360"/>
      <line x1="192" y1="264" x2="192" y2="360"/>
      <line x1="218" y1="264" x2="218" y2="360"/>
      <line x1="294" y1="264" x2="294" y2="360"/>
      <line x1="320" y1="264" x2="320" y2="360"/>
      <line x1="346" y1="264" x2="346" y2="360"/>
      <line x1="372" y1="264" x2="372" y2="360"/>
    </g>
    <rect x="253" y="236" width="6" height="152" fill="#0B5C82"/>
    <rect x="236" y="262" width="5" height="102" rx="2.5" fill="#0B5C82"/>
    <rect x="271" y="262" width="5" height="102" rx="2.5" fill="#0B5C82"/>
    <rect x="228" y="300" width="13" height="7" rx="3.5" fill="#0B5C82"/>
    <rect x="271" y="322" width="13" height="7" rx="3.5" fill="#0B5C82"/>
  </g>
  <g fill="#0B5C82">
    <rect x="120" y="244" width="26" height="26" rx="6"/>
    <rect x="366" y="244" width="26" height="26" rx="6"/>
    <rect x="120" y="354" width="26" height="26" rx="6"/>
    <rect x="366" y="354" width="26" height="26" rx="6"/>
  </g>
</svg>
